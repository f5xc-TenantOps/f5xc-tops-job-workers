name: Lambda CI

on:
  push:
    branches: [hive]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/workflows/build-lambda.yml"
  workflow_dispatch:
    inputs:
      force_rebuild_all:
        description: "Rebuild all lambdas regardless of changes"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_changes: ${{ steps.build-matrix.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed lambdas
        id: build-matrix
        run: |
          set -e

          # Get changed files
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_rebuild_all }}" == "true" ]]; then
            export REBUILD_ALL=true
          else
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" || -z "$BEFORE" ]]; then
              # Initial push to branch — rebuild everything
              export REBUILD_ALL=true
            else
              # Diff all commits in this push, not just the latest one
              export CHANGED=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || echo "")
              export REBUILD_ALL=false

              # If lambda-deps.yaml changed, rebuild everything
              if echo "$CHANGED" | grep -q "^lambda-deps.yaml$"; then
                export REBUILD_ALL=true
              fi
            fi
          fi

          # Check if shared/ changed
          export SHARED_CHANGED=false
          if [[ "$REBUILD_ALL" == "false" ]]; then
            if echo "$CHANGED" | grep -q "^shared/"; then
              export SHARED_CHANGED=true
            fi
          fi

          # Build matrix from lambda-deps.yaml
          pip install pyyaml --quiet
          python3 << 'PYEOF'
          import yaml, json, os

          with open("lambda-deps.yaml") as f:
              config = yaml.safe_load(f)

          rebuild_all = os.environ.get("REBUILD_ALL") == "true"
          shared_changed = os.environ.get("SHARED_CHANGED") == "true"
          changed_str = os.environ.get("CHANGED", "")
          changed_files = set(changed_str.strip().split("\n")) if changed_str.strip() else set()

          matrix_entries = []
          for name, spec in config["lambdas"].items():
              should_build = False
              if rebuild_all:
                  should_build = True
              elif shared_changed and spec["uses_shared"]:
                  should_build = True
              else:
                  # Check if any changed file is under this lambda's dir
                  for f in changed_files:
                      if f.startswith(spec["dir"] + "/"):
                          should_build = True
                          break

              if should_build:
                  matrix_entries.append({
                      "lambda_name": name,
                      "source_dir": spec["dir"],
                      "component": spec["component"],
                      "uses_shared": spec["uses_shared"]
                  })

          has_changes = len(matrix_entries) > 0
          # GitHub Actions matrix must have at least 1 entry or be skipped
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': matrix_entries})}\n")
              f.write(f"has_changes={'true' if has_changes else 'false'}\n")

          print(f"Lambdas to build: {len(matrix_entries)}")
          for e in matrix_entries:
              print(f"  - {e['lambda_name']} ({e['component']})")
          PYEOF

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/build-lambda.yml
    with:
      lambda_name: ${{ matrix.lambda_name }}
      source_dir: ${{ matrix.source_dir }}
      component: ${{ matrix.component }}
      uses_shared: ${{ matrix.uses_shared }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  commit-manifests:
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update s3Key in Crossplane manifests
        run: |
          pip install pyyaml --quiet
          python3 << 'PYEOF'
          import json, os

          short_sha = os.environ["GITHUB_SHA"][:7]
          matrix = json.loads(os.environ["MATRIX"])

          for entry in matrix["include"]:
              name = entry["lambda_name"]
              component = entry["component"]
              zip_name = f"{name}_{short_sha}.zip"
              manifest = f"crossplane/{component}/lambda.yaml"

              if not os.path.isfile(manifest):
                  print(f"WARNING: {manifest} not found, skipping")
                  continue

              with open(manifest) as f:
                  content = f.read()

              old = f"{name}_"
              if old not in content:
                  print(f"  {name}: no matching s3Key in {manifest}, skipping")
                  continue

              lines = content.split("\n")
              updated = 0
              for i, line in enumerate(lines):
                  if "s3Key:" in line and f"{name}_" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      lines[i] = f"{indent}s3Key: {zip_name}"
                      updated += 1

              with open(manifest, "w") as f:
                  f.write("\n".join(lines))

              print(f"  {name}: updated {updated} s3Key(s) in {manifest}")
          PYEOF
        env:
          MATRIX: ${{ needs.detect-changes.outputs.matrix }}

      - name: Commit and push manifest updates
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crossplane/
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "ci: update Crossplane s3Key for ${SHORT}

            Automated manifest update from Lambda CI pipeline."
            git push
          fi
